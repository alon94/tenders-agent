name: CI
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

jobs:
  unit:
    name: lint · types · regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  smoke:
    name: smoke + axe (against Vercel preview)
    runs-on: ubuntu-latest
    needs: unit
    # Vercel מפרסם preview לכל branch — כתובת יציבה לפי שם ה-branch.
    # ל-main משתמשים בכתובת production (SITE_URL כ-secret/variable).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: resolve preview URL
        id: url
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ] && [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "url=https://tenders-agent-git-${SLUG}-alonk.vercel.app" >> "$GITHUB_OUTPUT"
          fi
      - name: wait for Vercel deployment
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.url.outputs.url }}/api/nav-counts" >/dev/null; then exit 0; fi
            sleep 20
          done
          echo "preview not ready"; exit 1
      - name: diagnose what Vercel serves to the runner
        run: |
          curl -sS -D - -o /tmp/body "${{ steps.url.outputs.url }}/api/nav-counts" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS }}" | head -20
          head -c 400 /tmp/body; echo
      - run: npx playwright test
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
